[project]
name = "minimc"
version = "0.1.0"
description = "Mini-MC v0 — Cost-Structured Instance+VOI Environment"
readme = "README.md"
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
